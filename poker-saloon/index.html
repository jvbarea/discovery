  // Aceite da M4: VPIP, PFR e agressão de cada persona nas primeiras 500 mãos que ela joga (IA completa, semente fixa)
  function* personaStats(n, seed) {
    const st = CFG.poker.order.map(() => ({ hands: 0, vpip: 0, pfr: 0, aggr: 0, calls: 0 }));
    const rng = makeRng(seed ^ 0x5EED);
    let games = 0, total = 0;
    while (st.slice(1).some(x => x.hands < n) && total < 8000) {
      const g = Poker.createGame({ seed: (seed + games++ * 104729) >>> 0 });
      while (!g.over) {
        let street = 0;
        const acted = new Set(), vp = new Set(), pf = new Set(), ag = [0, 0, 0, 0, 0], ca = [0, 0, 0, 0, 0];
        const scan = evs => {
          for (const e of evs) {
            if (e.type === 'board') street = e.street;
            if (e.type !== 'act') continue;
            if (street === 0) { acted.add(e.seat); if (e.action === 'call' || e.action === 'raise') vp.add(e.seat); if (e.action === 'raise') pf.add(e.seat); }
            else if (e.action === 'raise' || e.action === 'bet') ag[e.seat]++; else if (e.action === 'call') ca[e.seat]++;
          }
        };
        scan(g.startHand()); total++;
        while (g.toAct >= 0) scan(g.act(g.toAct, AI.decide(g, g.toAct, rng)));
        for (const s of acted) {
          const x = st[s];
          if (x.hands >= n) continue;                          // cada persona conta exatamente as suas 500 primeiras mãos
          x.hands++; if (vp.has(s)) x.vpip++; if (pf.has(s)) x.pfr++;
          x.aggr += ag[s]; x.calls += ca[s];
        }
        if (total % 40 === 0) yield total;
      }
    }
    return { st, games, total };
  }

  const SIM_FAST = { samples: 60, maxSamples: 60 };           // na simulação de 20 mil mãos só as regras importam
  const EVENT_TYPES = new Set(['hand', 'blind', 'deal', 'act', 'refund', 'collect', 'burn', 'board', 'reveal', 'award', 'eliminate', 'gameover']);
  const ACTIONS = new Set(['fold', 'check', 'call', 'bet', 'raise']);
  // Simulação longa: IA contra IA, conferindo as invariantes a cada ação e a cada mão
  function* simulate(nHands, seed) {
    const s = { hands: 0, games: 0, actions: 0, chips: 0, negative: 0, unpaid: 0, button: 0, illegal: 0, unfinished: 0, maxHands: 0, ms: 0, events: 0, replay: 0 };
    const t0 = performance.now(), rng = makeRng(seed ^ 0x5EED);
    // O Diretor só enxerga eventos: somar blinds, ações, devoluções e prêmios tem de reproduzir as pilhas do motor
    const acc = [0, 0, 0, 0, 0];
    const track = evs => {
      for (const e of evs) {
        if (!EVENT_TYPES.has(e.type) || (e.type === 'act' && !ACTIONS.has(e.action))) s.events++;
        if (e.type === 'hand' && e.stacks.some((v, i) => v !== acc[i])) s.replay++;
        if (e.type === 'blind' || (e.type === 'act' && e.amount)) acc[e.seat] -= e.amount;
        else if (e.type === 'refund') acc[e.seat] += e.amount;
        else if (e.type === 'award') for (const w of e.winners) acc[w.seat] += w.amount;
      }
      return evs;
    };
    while (s.hands < nHands) {
      const g = Poker.createGame({ seed: (seed + s.games * 7919) >>> 0 }), G = g.G;
      s.games++;
      G.players.forEach((p, i) => { acc[i] = p.stack; });
      let h = 0, prev = -1;
      while (!g.over) {
        // O botão é conferido no início da mão (evento "hand"): com blinds all-in a mão pode terminar dentro do startHand
        const he = track(g.startHand())[0];
        s.hands++; h++;
        if (he.type !== 'hand' || he.stacks[he.button] <= 0 || he.button === prev) s.button++;
        prev = he.button;
        while (G.toAct >= 0) {
          const seat = G.toAct, d = AI.decide(g, seat, rng, SIM_FAST);
          s.actions++;
          try { track(g.act(seat, d)); } catch (e) { s.illegal++; track(g.act(seat, { type: g.legal(seat).canCheck ? 'check' : 'fold' })); }
          let chips = G.pot;
          for (const p of G.players) { chips += p.stack + p.bet; if (p.stack < 0) s.negative++; }
          if (chips !== g.total) s.chips++;
        }
        let sum = 0;
        for (const p of G.players) { sum += p.stack; if (p.bet !== 0) s.unpaid++; if (p.stack !== acc[p.seat]) s.replay++; }
        if (G.pot !== 0) s.unpaid++;
        if (sum !== g.total) s.chips++;
        if (h > 3000) { s.unfinished++; break; }
        if (s.hands % 250 === 0) yield s;
      }
      s.maxHands = Math.max(s.maxHands, h);
    }
    s.ms = performance.now() - t0;
    return s;
  }
  // Determinismo: uma partida inteira pela semente e o hash FNV-1a do log de eventos
  function gameHash(seed) {
    const g = Poker.createGame({ seed }), rng = makeRng(seed ^ 0x5EED);
    while (!g.over) { g.startHand(); while (g.toAct >= 0) g.act(g.toAct, AI.decide(g, g.toAct, rng)); }
    let h = 0x811C9DC5;
    for (const e of g.G.log) h = fnv1a(JSON.stringify(e), h);
    return { hash: h.toString(16).padStart(8, '0'), events: g.G.log.length, hands: g.G.handNo };
  }

  async function runTests() {
    const box = el('div', { id: 'tests', role: 'status' }, '<h2>Bateria de testes</h2><p class="sum">Rodando…</p><div class="rows"></div>');
    document.body.appendChild(box);
    const rows = box.querySelector('.rows'), sumEl = box.querySelector('.sum'), results = [];
    let group = '';
    const addRow = (grp, name, ok, detail) => {
      if (grp !== group) { group = grp; rows.appendChild(el('div', { class: 'grp' }, escapeHtml(grp))); }
      rows.appendChild(el('div', { class: 'row ' + (ok ? 'ok' : 'fail') }, `<b>${ok ? '✔' : '✘'}</b><span>${escapeHtml(name)}</span>${detail ? `<em>${escapeHtml(detail)}</em>` : ''}`));
      results.push({ grupo: grp, teste: name, ok, detalhe: detail || '' });
    };
    for (const t of TESTS.list) {
      let ok = false, detail = '';
      try {
        const r = t.fn();
        if (r && typeof r === 'object') { ok = !!r.ok; detail = r.detail || ''; } else ok = r === true;
      } catch (e) { ok = false; detail = 'erro: ' + e.message; }
      addRow(t.group, t.name, ok, detail);
      await nextFrame();
    }
    // 20.000 mãos fatiadas entre quadros para a página seguir respondendo
    const it = simulate(20000, PARAMS.seed);
    let st;
    for (;;) {
      st = it.next();
      if (st.done) break;
      sumEl.textContent = `Simulando… ${fmtInt(st.value.hands)} de 20.000 mãos`;
      await nextFrame();
    }
    const s = st.value, GS = 'Simulação: 20.000 mãos, IA contra IA, sem render';
    addRow(GS, `${fmtInt(s.hands)} mãos em ${s.games} Sit & Go`, s.hands >= 20000, `${(s.ms / 1000).toFixed(1).replace('.', ',')} s · ${fmtInt(s.actions)} ações · semente ${PARAMS.seed}`);
    addRow(GS, 'Soma das fichas constante', s.chips === 0, s.chips ? `${s.chips} violações` : 'conferida depois de cada ação');
    addRow(GS, 'Nenhum stack negativo', s.negative === 0, s.negative ? `${s.negative} ocorrências` : '');
    addRow(GS, 'Todo pote pago por inteiro', s.unpaid === 0, s.unpaid ? `${s.unpaid} mãos com sobra` : 'pote e apostas zerados ao fim de cada mão');
    addRow(GS, 'O botão sempre avança para um jogador ativo', s.button === 0, s.button ? `${s.button} mãos erradas` : '');
    addRow(GS, 'Toda ação é legal', s.illegal === 0, `${s.illegal} recusadas pelo motor`);
    addRow(GS, 'Todo Sit & Go termina', s.unfinished === 0, `a partida mais longa teve ${s.maxHands} mãos`);
    addRow(GS, 'Todo evento tem um dos tipos do ♦2', s.events === 0, s.events ? `${s.events} eventos fora do padrão` : 'ações em "act", com o tipo em "action"');
    addRow(GS, 'Os eventos reproduzem as pilhas do motor', s.replay === 0, s.replay ? `${s.replay} divergências` : 'o que o Diretor soma dos eventos bate com o motor a cada mão');
    await nextFrame();
    const a = gameHash(PARAMS.seed), b = gameHash(PARAMS.seed), c = gameHash((PARAMS.seed + 1) >>> 0);
    addRow('Determinismo', 'Mesma semente, mesmo log de eventos', a.hash === b.hash && a.events === b.events, `hash ${a.hash} · ${fmtInt(a.events)} eventos em ${a.hands} mãos`);
    addRow('Determinismo', 'Semente diferente, log diferente', a.hash !== c.hash, `hash ${c.hash}`);
    // Aceite da M4: VPIP e PFR de cada persona em 500 mãos, a até 5 pontos do alvo do ♦5
    const pit = personaStats(500, 500);
    let pr;
    for (;;) {
      pr = pit.next();
      if (pr.done) break;
      sumEl.textContent = `Medindo as personas… ${fmtInt(pr.value)} mãos na mesa`;
      await nextFrame();
    }
    const PS = pr.value, GP = 'IA (♦5): 500 mãos de cada persona, semente fixa 500', n1 = x => x.toFixed(1).replace('.', ','), n2 = x => x.toFixed(2).replace('.', ',');
    CFG.poker.order.forEach((id, seat) => {
      if (seat === 0) return;
      const x = PS.st[seat], C = CFG.ai.personas[id], v = 100 * x.vpip / x.hands, f = 100 * x.pfr / x.hands, af = x.aggr / Math.max(1, x.calls);
      addRow(GP, `${nameOf(seat)}: VPIP e PFR a até 5 pontos do alvo`, x.hands >= 500 && Math.abs(v - C.vpip) <= 5 && Math.abs(f - C.pfr) <= 5,
        `VPIP ${n1(v)}% (alvo ${C.vpip}%) · PFR ${n1(f)}% (alvo ${C.pfr}%) · agressão ${n2(af)} (alvo ${n2(C.af)}) · ${fmtInt(x.hands)} mãos`);
    });
    // Áudio (Q♥): 8 s renderizados fora da tela (nada toca), sem NaN, sem estourar e audíveis
    const au = await audioSelfTest();
    addRow('Áudio (Q♥)', 'Ambiente, piano e efeitos renderizados fora da tela', au.ok, au.detail);
    const passed = results.filter(r => r.ok).length, allOk = passed === results.length;
    sumEl.className = 'sum ' + (allOk ? 'ok' : 'fail');
    sumEl.textContent = `${passed} de ${results.length} testes verdes`;
    TESTS.report = { passed, total: results.length, results, sim: s };
    console.table(results);
    console.log('TESTES ' + JSON.stringify({ verdes: passed, total: results.length, falhas: results.filter(r => !r.ok).map(r => r.teste) }));
  }

  // --- ?gallery=1: as texturas geradas em 2D, para comparar com as Refs A, B e C ---
  function showGallery() {

      '<h2>Galeria de texturas</h2><p>Tudo aqui foi desenhado em código nesta página, sem nenhuma imagem. Compare os versos com a Ref A, as fichas com a Ref B e o botão com a Ref C.</p>');
    const row = (title, items, round = false) => {
      const r = el('div', { class: round ? 'gal round' : 'gal' }, `<h3>${escapeHtml(title)}</h3>`);
      for (const [cv, cap, h] of items) {
        cv.style.height = h;
        const f = el('figure');
        f.append(cv, el('figcaption', {}, escapeHtml(cap)));
        r.appendChild(f);
      }
      box.appendChild(r);
    };
    const C = CFG.card, face = s => { const cv = mkCanvas(C.backW, C.backH); drawCardFace(cv.getContext('2d'), Poker.parseCard(s), C.backW, C.backH); return cv; };
    row('Versos (♥7, Ref A): nove camadas', [[TEX.backBlue, 'azul #1F2A55 · baralho em jogo', '46vh'], [TEX.backRed, 'vermelho #B0303F · reserva do estojo', '46vh']]);
    row('Frentes (♥8): papel marfim, índices, pips e figuras', [['As', 'Ás de espadas'], ['Kh', 'Rei de copas'], ['Qd', 'Dama de ouros'], ['Jc', 'Valete de paus'], ['Ts', '10 de espadas'], ['7d', '7 de ouros'], ['3h', '3 de copas']].map(([s, cap]) => [face(s), cap, '32vh']));
    row('Fichas (♥9, Ref B) e botão DEALER (♥10, Ref C)', TEX.chips.map((cv, i) => [cv, i < 7 ? `${CFG.chips.values[i]} · ${money(CFG.chips.values[i])}` : 'DEALER', '18vh']), true);
    document.body.appendChild(box);
  }

  // ===== §17 Boot =====
  let T = 0, lastNow = 0;
  // O canvas fica sempre na resolução do monitor: mudar canvas.width apaga o quadro já desenhado, e a tela piscava em
  // preto a cada ajuste do Auto. Só os alvos internos seguem a escala; a composição amplia a imagem até a tela
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, CFG.maxDpr);
    const cw = Math.max(2, Math.round(UI.canvas.clientWidth * dpr)), ch = Math.max(2, Math.round(UI.canvas.clientHeight * dpr));
    if (UI.canvas.width !== cw || UI.canvas.height !== ch) { UI.canvas.width = cw; UI.canvas.height = ch; }
    const w = Math.max(2, Math.round(cw * QUALITY.scale)), h = Math.max(2, Math.round(ch * QUALITY.scale));
    CAM.aspect = cw / ch;
    if (w !== R.w || h !== R.h || R.msaaOn !== QUALITY.msaa) resizeTargets(w, h);
    if (UI.guide) { UI.guide.width = Math.round(window.innerWidth * dpr); UI.guide.height = Math.round(window.innerHeight * dpr); }
    hudDirty();
  }
  function loop(now) {
    requestAnimationFrame(loop);
    const c0 = performance.now(), raw = lastNow ? (now - lastNow) / 1000 : 1 / 60, dt = Math.min(0.1, raw);
    lastNow = now; T += dt;
    pollPad(dt);
    inputTick(now);
    animStep(dt);
    updateHold(dt);
    updateInstances();
    updateLight(T);
    updateCamera(dt, T);
    updateCast(dt, T);
    updateYouHands(dt);
    if (castShadowMoved()) SHADOW.castDirty = true;                 // mãos e antebraços andaram: refaz a sombra deles
    autoTick(now, raw);                                            // antes do render: a nova escala já vale neste quadro
    renderFrame(T);
    hudTick(now);
    if (UI.guide) drawGuide(measureGuide());
    fpsTick(now, raw);
    FPS.cpu += (performance.now() - c0 - FPS.cpu) * 0.05;
  }
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
  // Elenco (♥J): cada peça sai do Surface Nets em sequência, cedendo o quadro a cada ~40 ms para a barra andar
  const CAST_INFO = { ms: 0, tris: 0 };
  async function buildCast(progress) {
    const ids = ['dealer', 'colonel', 'lucien', 'edgar', 'adelaide'], total = ids.length * 10;
    let n = 0, last = performance.now();
    const yieldFn = async () => { n++; if (performance.now() - last > 150) { progress(Math.min(1, n / total)); await nextFrame(); last = performance.now(); } };
    const t0 = performance.now();
    for (const id of ids) { const data = await buildCharacter(id, yieldFn); addCast(id, data); castLookAt(CAST[CAST.length - 1], [0, 0.1, 0]); }
    await buildYouHands(yieldFn);
    CAST_INFO.ms = performance.now() - t0; CAST_INFO.tris = CAST.reduce((a, c) => a + c.mesh.tris, 0);
    CAST_INFO.per = Object.fromEntries(CAST.map(c => [c.id, c.mesh.tris])); CAST_INFO.per.you = YOU.mesh.tris;
  }
  const BOOT = { t0: performance.now(), ms: 0 };
  async function boot() {
    buildDOM();
    loadOpts();
    if (!initGL(UI.canvas)) {
      showFatal('Este jogo precisa de WebGL2',
        'O navegador não abriu um contexto WebGL2, que o jogo usa para desenhar a mesa em 3D. Use o Chrome, o Edge ou o Firefox atualizados e confira se a aceleração por hardware está ligada nas configurações do navegador.');
      return;
    }
    try {
      bindInput(UI.canvas);
      setLoading(0.05, 'Pintando cartas…');
      await loadFonts();
      await buildCardTextures(f => setLoading(0.05 + f * 0.5, 'Pintando cartas…'));
      setLoading(0.58, 'Cunhando fichas…');
      await nextFrame();
      buildChipTextures();
      buildLidTexture();
      bakeNoiseTextures();
      setLoading(0.7, 'Acendendo o lampião…');
      await nextFrame();
      applyQuality(PARAMS.quality !== 'auto' ? PARAMS.quality : OPTS.quality);
      compilePrograms();
      setLoading(0.74, 'Calculando probabilidades…');
      await nextFrame();
      for (const it = AI.buildPreflop(); ;) {                     // 169 mãos × 1 a 4 oponentes × 2000 amostras, em fatias
        const end = performance.now() + 30;
        let r;
        do r = it.next(); while (!r.done && performance.now() < end);
        if (r.done) break;
        setLoading(0.74 + 0.1 * r.value, 'Calculando probabilidades…');
        await nextFrame();
      }
      setLoading(0.85, 'Montando a mesa…');
      await nextFrame();
      buildScene();
      initShadows();
      setLoading(0.86, 'Esculpindo rostos…');
      await nextFrame();
      await buildCast(f => setLoading(0.86 + 0.11 * f, 'Esculpindo rostos…'));
      renderPortraits();
      setLoading(0.97, 'Afinando o piano…');
      await nextFrame();
      bakeSfx();
      buildHUD();
      buildScreens();
      // ?guide=1, ?test=1 e ?gallery=1 mostram a mesa parada da Ref D; o jogo abre no título (?autoplay=1 pula direto)
      const demo = PARAMS.guide || PARAMS.test || PARAMS.gallery;
      if (demo) { demoTable(); if (PARAMS.guide) demoHUD(); } else layoutTable();
      setLoading(1, 'Puxando a cadeira…');
      await nextFrame();
      const unlock = () => { audioStart(); if (AU.ctx) { removeEventListener('pointerdown', unlock, true); removeEventListener('keydown', unlock, true); } };
      addEventListener('pointerdown', unlock, true); addEventListener('keydown', unlock, true);
      document.addEventListener('visibilitychange', () => { if (AU.ctx) (document.hidden ? AU.ctx.suspend() : AU.ctx.resume()).catch(() => {}); });
      if (PARAMS.gallery) showGallery();
      if (PARAMS.guide) setupGuide();
      if (PARAMS.debug) setupDebug();
      resize();
      window.addEventListener('resize', resize);
      requestAnimationFrame(loop);
      BOOT.ms = performance.now() - BOOT.t0;
      hideLoading();
      if (PARAMS.test) runTests();
      if (!demo) { if (PARAMS.autoplay) startMatch(PARAMS.seed); else showTitle(true); }
    } catch (err) {
      console.error(err);
      showFatal('A mesa não pôde ser montada', 'Algo falhou ao preparar a cena. O detalhe abaixo ajuda a corrigir o problema.', err && err.message || String(err));
    }
  }
  document.addEventListener('DOMContentLoaded', boot);

  return {
    version: 'M7', PARAMS, poker: Poker, ai: AI, money, chipsFor, table: TABLE, layout: () => layoutTable(),
    state: () => ({ mode: DIR.mode, hand: DIR.handNo, turn: !!DIR.turn, legal: DIR.turn ? { ...DIR.turn.L, amount: DIR.turn.amount } : null,
      stacks: TABLE.stacks.slice(), out: DIR.out.slice(), status: DIR.status.slice(), paused: ANIM.paused, rate: ANIM.rate, flyers: FLY.size, tweens: ANIM.list.length }),
    start: seed => startMatch(seed >>> 0),
    stats: () => ({ fps: FPS.fps, ms: FPS.ms, long: FPS.long, worst: FPS.worst * 1000, draws: STATS.draws, tris: STATS.tris, w: R.w, h: R.h, samples: R.samples, hdr: GLX.floatRT, gpu: GLX.renderer, frames: FPS.total, cpuMs: FPS.cpu, castMs: CAST_INFO.ms, castTris: CAST_INFO.tris, castPer: CAST_INFO.per, loadMs: BOOT.ms, inst: [CHIPS.n, CARDS.n], gpuMs: { ...GPUT.ms }, quality: QUALITY.preset, scale: QUALITY.scale }),
    quality: q => applyQuality(q), cfg: CFG,
    prop: kind => { const c = castOf('colonel'); if (c && !c.prop) propStart(c, kind); },
    leave: id => leaveAnim(id, TM.leave).then(() => wait(600)).then(() => placeCast(id, 0, 0, true)),
    audio: () => ({ on: AU.on, state: AU.ctx ? AU.ctx.state : 'sem contexto', t: AU.ctx ? +AU.ctx.currentTime.toFixed(2) : 0, bar: AU.piano.bar, form: AU.piano.form }),
    audioLevels: async () => {                      // RMS e pico de cada camada, 8 s fora da tela
      const OAC = window.OfflineAudioContext, sr = 44100, out = {};
      for (const layer of ['piano', 'ambiente', 'efeitos']) {
        const ctx = new OAC(2, sr * 8, sr), G = audioGraph(ctx);
        if (layer !== 'ambiente') G.amb.disconnect();
        if (layer === 'piano') { G.amb.connect(G.master); for (const n of [G.fx]) n.disconnect(); }
        if (layer === 'ambiente') { G.pianoIn.disconnect(); G.fx.disconnect(); }
        if (layer === 'efeitos') G.pianoIn.disconnect();
        if (layer === 'piano') { const m = ragPhrase(RAG.A, makeRng(96)); for (let b = 0; b < 6; b++) ragBar(ctx, G.pianoIn, 0.1 + b * ragBarSec(), RAG.A[b], m[b]); }
        if (layer === 'efeitos') {
          const one = (name, t, g) => { const s = ctx.createBufferSource(), a = ctx.createGain(); s.buffer = G.buf[name][0]; a.gain.value = g; s.connect(a); a.connect(G.fx); s.start(t); };
          for (let i = 0; i < 6; i++) one('chip', 1 + i * 0.03, 0.5); one('deal', 2, 0.3); one('thump', 2.03, 0.45); one('flip', 3, 0.4); one('shuffle', 4, 0.5); one('tick', 6, 0.35);
        }
        const r = await ctx.startRendering(), L = r.getChannelData(0);
        let pk = 0, sum = 0; for (let i = 0; i < L.length; i++) { pk = Math.max(pk, Math.abs(L[i])); sum += L[i] * L[i]; }
        out[layer] = { picoDb: +(20 * Math.log10(pk + 1e-9)).toFixed(1), rmsDb: +(20 * Math.log10(Math.sqrt(sum / L.length) + 1e-9)).toFixed(1) };
      }
      return out;
    },
    portraits: () => Object.fromEntries(Object.entries(PORTRAITS).map(([k, v]) => [k, v.toDataURL()])),
    castBad: () => { let bad = 0; for (const c of CAST) for (let i = 0; i < c.bones.length; i++) if (!Number.isFinite(c.bones[i])) { bad++; break; } return bad; },
    instBad: () => { let bad = 0; for (const [im, st] of [[CHIPS, CHIP_STRIDE], [CARDS, CARD_STRIDE]]) for (let i = 0; i < im.n; i++) for (let j = 0; j < st; j++) if (!Number.isFinite(im.data[i * st + j])) { bad++; break; } return bad; },
    cardsDebug: () => { const d = CARDS.data, hi = []; for (let i = 0; i < CARDS.n; i++) { const o = i * CARD_STRIDE; if (d[o + 18] >= 1) hi.push([d[o + 16], +d[o + 18].toFixed(2), +d[o + 12].toFixed(3), +d[o + 13].toFixed(3), +d[o + 14].toFixed(3)]); } return { n: CARDS.n, fly: FLY.size, hi, held: TABLE.holes[0].held, hn: TABLE.holes[0].n }; },
    guide: () => GUIDE.report,
    tests: () => TESTS.report,
  };
})();
</script>
